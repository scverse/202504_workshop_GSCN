name: deploy-jupyter-book

on:
    push:
        branches:
            - main

# This job installs dependencies, build the book, and pushes it to personal pages
jobs:
    deploy-book:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            # Install dependencies
            - name: Set up Python 3.12
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"

            - name: Install dependencies
              run: |
                  pip install jupyter-book
            # Build the book
            - name: Build the book
              run: |
                  jupyter-book build notebooks
            # Push the book's HTML to personal pages
            - name: Deploy to GitHub Pages
              uses: JamesIves/github-pages-deploy-action@v4
              with:
                folder: notebooks/_build/html
                branch: docs
                repository-name: timtreis/timtreis.github.io
                token: ${{ secrets.DOC_DEPLOY_SECRET }}
                clean: true
                clean-exclude: |
                  .nojekyll
                  CNAME